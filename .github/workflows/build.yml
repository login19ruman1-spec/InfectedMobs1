name: Build InfectedMobs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle project
        run: |
          test -f build.gradle
          test -f settings.gradle
          echo "Gradle project found in repository root"

      - name: Build plugin
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: InfectedMobs-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
