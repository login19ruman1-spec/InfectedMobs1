plugins {
    id 'java'
}

group = 'dev.infectedmobs'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = uri('https://repo.papermc.io/repository/maven-public/') }
    maven { name = 'magmaguyRepoReleases'; url = uri('https://repo.magmaguy.com/releases') }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    compileOnly 'com.magmaguy:FreeMinecraftModels:2.12.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

jar {
    archiveBaseName = 'InfectedMobs'
}
