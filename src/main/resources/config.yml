sculk:
  infection:
    radius: 16
    spawn-chance: 0.10
    emerge-chance: 0.03
    emerge-interval-ticks: 100
    emerge-range: 8
    hp-multiplier: 1.5
    speed-multiplier: 1.2
    damage-multiplier: 1.3
  effect:
    duration-ticks: 200
    damage-per-tick: 1.0
    max-stacks: 3
    tick-interval: 40

moss:
  infection:
    radius: 8
    revive-chance: 0.15
    hp-multiplier: 1.3
    speed-multiplier: 1.1
  day:
    frozen: true
    can-be-killed: true
  night:
    active: true
    effect:
      slowness-level: 1
      blindness-level: 0
      duration-ticks: 60

combat:
  melee-effect-distance: 3.25
  ranged-effect-distance: 24.0

models:
  use-fmm: true
  sculk-zombie: "sculk_infected_zombie"
  sculk-skeleton: "sculk_infected_skeleton"
  sculk-spider: "sculk_infected_spider"
  sculk-creeper: "sculk_infected_creeper"
  moss-zombie: "moss_infected_zombie"
  moss-skeleton: "moss_infected_skeleton"
  moss-creeper: "moss_infected_creeper"

# Animation contract used by InfectedMobs.
# spawn is optional. InfectedMobs explicitly controls idle <-> walk so the model cannot get stuck in idle.
# attack/death are triggered by the plugin. Names are case-sensitive in the model file.
animations:
  sculk-zombie:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 14
  sculk-skeleton:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    ranged-attack: "attack_ranged"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 15
  sculk-spider:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 14
  sculk-creeper:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 24
  moss-zombie:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 14
  moss-skeleton:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    ranged-attack: "attack_ranged"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 15
  moss-creeper:
    spawn: "spawn"
    idle: "idle"
    walk: "walk"
    attack: "attack"
    death: "death"
    spawn-lock-ticks: 12
    attack-lock-ticks: 24
