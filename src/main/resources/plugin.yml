name: InfectedMobs
version: ${version}
main: dev.infectedmobs.InfectedMobsPlugin
api-version: '1.21.4'
author: InfectedMobs
description: Sculk and moss infected hostile mobs with configurable FMM models.
depend:
  - FreeMinecraftModels

commands:
  infectedmobs:
    description: Admin testing and diagnostics for InfectedMobs
    usage: /infectedmobs <list|spawn|info|anim|reload>
    permission: infectedmobs.admin
permissions:
  infectedmobs.admin:
    default: op
